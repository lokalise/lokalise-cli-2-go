on: [push, pull_request]
name: build
env:
  GO111MODULE: on

jobs:
  check:
    strategy:
      matrix:
        go-version: [1.23.x]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run go fmt
        run: diff -u <(echo -n) <(gofmt -d -s .)

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test -v -race ./...
