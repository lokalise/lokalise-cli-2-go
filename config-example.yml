# Lokalise CLI v2 example config
# Copy it to config.yml and modify to use

# API token
# You can create token at Personal profile page at https://lokalise.com/profile
token: a12345a12345a12345a12345a12345a12345a123

# Default Project ID
# If set, used for all endpoints requiring project-id flag.
#project-id: '373182575d64e892ba8ab2.58226357'

# Number of retries for API requests.
# Default is 3.
#retry-count: 5

# Sleep time before retrying a request.
# Default is 100 milliseconds.
#retry-timeout: 500ms

# Connection timeout for API requests.
# Default is 1 min.
#connection-timeout: 5s

# Items to return per page.
# Default is 5000 (max available in API).
#page-limit: 1000

# Suppress progress messages (same as --quiet).
# Command results (JSON) and errors are still printed.
# Default is false.
#quiet: true

# Debug API requests.
# WARNING: debug output is sensitive. It logs full API requests and responses,
# including the pre-signed bundle URLs returned by `file download`, which let
# anyone holding them download your files while they are valid.
# Do not enable it in CI or anywhere logs are retained or shared.
# Default is false.
#debug: true
